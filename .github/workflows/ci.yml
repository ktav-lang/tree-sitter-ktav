name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # README.md/.ru.md/.zh.md, CHANGELOG.md/.ru.md/.zh.md and
  # CONTRIBUTING.md/.ru.md/.zh.md are generated by @ktav-lang/polydoc
  # from the root-docs/ unit trees. This job fails when a committed
  # artifact drifts from its source — which is what a hand-edit of the
  # artifact looks like. Fix the source and re-run the generator; never
  # patch the artifact.
  docs:
    name: Docs (generated markdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Generated docs are byte-identical to their source units
        run: node scripts/build-docs.mjs --check

  test:
    name: tree-sitter test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install tree-sitter CLI
        # Pin to a specific minor — tree-sitter regenerates parser.c
        # and tree_sitter/*.h from grammar.js on every `generate`, and
        # the header layout shifts between minors. Pinning keeps the
        # generated artifacts reproducible across CI runs and matches
        # what's committed under src/.
        run: npm install -g tree-sitter-cli@0.26.8

      - name: Regenerate parser
        # Parser sources under src/ are committed for downstream
        # consumers (Neovim's nvim-treesitter expects them in the repo)
        # but we always re-derive them from grammar.js in CI before
        # running tests, so a `grammar.js` change that wasn't followed
        # by `tree-sitter generate` still gets exercised.
        run: tree-sitter generate

      - name: Run corpus tests
        run: tree-sitter test

  rust:
    name: cargo build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pulls in `spec/` for tests/conformance.rs (walks the
          # language-agnostic Ktav test suite from ktav-lang/spec).
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo build
        run: cargo build --verbose
      - name: cargo test
        run: cargo test --verbose

  node:
    name: node-gyp build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-2022, not windows-latest. `windows-latest` now resolves
        # to Windows Server 2025, and the node-gyp bundled with the npm
        # that ships in Node 20 (node-gyp 10.1.0) cannot discover Visual
        # Studio on that image: "Could not find any Visual Studio
        # installation to use". Nothing in this repository is at fault —
        # the other Windows job on the same image passes.
        #
        # This is a pin, not a fix. Drop it once this job runs on a Node
        # whose npm bundles node-gyp 11.x, which discovers VS on 2025.
        os: [ubuntu-latest, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node -e "require('./bindings/node')"
