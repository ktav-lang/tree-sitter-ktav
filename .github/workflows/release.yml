name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify on tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g tree-sitter-cli@0.26.8
      - run: tree-sitter generate
      - run: tree-sitter test
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --verbose
      - run: cargo test --verbose

  publish-crate:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    # crates.io Trusted Publishing (OIDC): the workflow trades its
    # short-lived GitHub OIDC identity for a crates.io token that
    # expires within the run. No long-lived registry token is stored
    # in the repository. crates.io side — Settings → Trusted
    # Publishing → "Add a new Trusted Publisher" on the
    # `tree-sitter-ktav` crate: Repository owner `ktav-lang`,
    # Repository name `tree-sitter-ktav`, Workflow filename
    # `release.yml`, Environment name `crates-io` (must match the
    # `environment:` key below).
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g tree-sitter-cli@0.26.8
      - run: tree-sitter generate
      - uses: dtolnay/rust-toolchain@stable
      - name: Exchange the OIDC identity for a crates.io token
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # `tree-sitter generate` re-emits `src/parser.c` which is
        # already committed but may differ in incidental whitespace
        # or version banners — `--allow-dirty` lets the publish
        # proceed against the regenerated tree.
        run: cargo publish --allow-dirty --token "$CARGO_REGISTRY_TOKEN"

  publish-npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g tree-sitter-cli@0.26.8
      - run: tree-sitter generate
      - run: npm install
      # npm tries OIDC trusted publishing first and falls back to
      # NPM_TOKEN when no trusted publisher is configured (e.g. the
      # very first publish). npmjs.com side — package Settings →
      # Trusted Publisher → GitHub Actions, repo `ktav-lang/tree-sitter-ktav`,
      # workflow `release.yml`, environment `npm`.
      - name: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

  github-release:
    name: GitHub Release
    needs: [publish-crate, publish-npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog notes for this tag
        id: notes
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # Pull the section between "## [TAG]" and the next "## [" header.
          awk -v tag="$TAG" '
            BEGIN { found = 0 }
            /^## \[/ {
              if (found) exit
              if ($0 ~ "^## \\[" tag "\\]") { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release v$TAG" > release-notes.md
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          generate_release_notes: false
