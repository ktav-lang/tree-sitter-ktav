<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tree-sitter-ktav playground</title>
<style>
  :root { --bg:#1e1f22; --panel:#26282c; --fg:#d7dae0; --muted:#8b9099; --line:#3a3d43; --err:#ff5c5c; --ok:#5fd38d; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  select, button, input[type=search] { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:4px 8px; font:inherit; }
  button { cursor:pointer; } button:hover { border-color:var(--muted); }
  label { color:var(--muted); user-select:none; }
  #status { font-weight:600; }
  .ok { color:var(--ok); } .bad { color:var(--err); } .muted { color:var(--muted); }
  main { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:1px; background:var(--line); height:calc(100vh - 230px); min-height:360px; }
  main > section { background:var(--bg); display:flex; flex-direction:column; min-width:0; min-height:0; }
  main h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0; padding:6px 10px; border-bottom:1px solid var(--line); font-weight:600; }
  textarea, pre.view, #tree { flex:1; margin:0; padding:10px; overflow:auto; font:13px/1.5 ui-monospace, Consolas, monospace; white-space:pre; tab-size:4; }
  textarea { background:var(--bg); color:var(--fg); border:0; resize:none; outline:none; }
  #tree { white-space:normal; }
  #tree div { white-space:pre; cursor:default; }
  #tree div:hover { background:#34373d; }
  #tree .f { color:#9aa5ce; } #tree .r { color:var(--muted); font-size:11px; } #tree .anon { color:var(--muted); }
  #tree .e { color:var(--err); font-weight:600; }
  #info { padding:8px 16px; border-top:1px solid var(--line); max-height:170px; overflow:auto; }
  #info pre { margin:4px 0 0; white-space:pre-wrap; font:12px ui-monospace, Consolas, monospace; color:var(--muted); }
  #report { padding:0 16px 16px; }
  #report table { border-collapse:collapse; margin:8px 0; }
  #report td, #report th { border:1px solid var(--line); padding:3px 10px; text-align:left; }
  #report a { color:#7aa2f7; cursor:pointer; }
  .legend { display:flex; gap:10px; flex-wrap:wrap; font:12px ui-monospace, Consolas, monospace; }
  /* highlight captures */
  .c-comment { color:#6a737d; font-style:italic; }
  .c-property { color:#7aa2f7; }
  .c-string { color:#9ece6a; }
  .c-string-special { color:#e0af68; }
  .c-string-special-key { color:#73daca; }
  .c-string-escape { color:#ff9e64; font-weight:600; }
  .c-number, .c-number-float { color:#ff9e64; }
  .c-constant-builtin, .c-constant-builtin-boolean { color:#bb9af7; font-weight:600; }
  .c-punctuation-bracket { color:#e8e8e8; }
  .c-punctuation-delimiter, .c-punctuation-special { color:#89ddff; }
  .err { text-decoration: wavy underline var(--err); background:rgba(255,92,92,.15); }
  .missing { color:var(--err); font-weight:700; }
  .ws { color:#5c6370; }
  .sel { outline:1px solid #e0af68; background:rgba(224,175,104,.18); }
</style>
</head>
<body>
<header>
  <h1>tree-sitter-ktav <span class="muted">playground</span></h1>
  <select id="fixture"><option value="">— demo document —</option></select>
  <input id="filter" type="search" placeholder="filter fixtures…" size="18">
  <button id="demo">Demo</button>
  <button id="runall">Run the whole corpus</button>
  <label><input id="showws" type="checkbox" checked> show whitespace</label>
  <label><input id="anon" type="checkbox"> anonymous nodes</label>
  <span id="status" class="muted">loading…</span>
</header>
<main>
  <section><h2>Source (editable)</h2><textarea id="src" spellcheck="false"></textarea></section>
  <section><h2>Highlighting from queries/highlights.scm</h2><pre class="view" id="view"></pre></section>
  <section><h2>Syntax tree</h2><div id="tree"></div></section>
</main>
<div id="info"></div>
<div id="report"></div>
<script type="module" src="app.js"></script>
</body>
</html>
